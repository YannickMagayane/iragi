<svg xmlns="http://www.w3.org/2000/svg" width="960" height="645" viewBox="0 0 960 645" role="img" aria-labelledby="title desc">
<title id="title">Iragi benchmark comparison</title>
<desc id="desc">Median CSV and PDF elapsed time and Python-traced memory for the recorded benchmark fixture.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#475569}.heading{font-size:16px;font-weight:700}.note{font-size:11px;fill:#475569}.label{font-size:12px}.value{font-size:12px;font-weight:700}.track{fill:#e2e8f0}.bar0{fill:#64748b}.bar1{fill:#2563eb}.bar2{fill:#0f766e}</style>
<text x="32" y="38" class="title">Iragi 0.6.3 benchmark comparison</text>
<text x="32" y="61" class="subtitle">5 independent timed processes per mode; median shown · one warm-up per mode</text>
<text x="32" y="100" class="heading">CSV elapsed time · seconds · lower is faster</text>
<text x="32" y="119" class="note">Pandas read_csv parses only; Iragi modes also profile and score.</text>
<text x="40" y="158" class="label">Pandas parse only</text>
<rect x="280" y="145" width="500" height="17" rx="4" class="track"/>
<rect x="280" y="145" width="40.1" height="17" rx="4" class="bar0"/>
<text x="792" y="158" class="value">0.029 s</text>
<text x="40" y="187" class="label">Iragi classic scan</text>
<rect x="280" y="174" width="500" height="17" rx="4" class="track"/>
<rect x="280" y="174" width="137.1" height="17" rx="4" class="bar1"/>
<text x="792" y="187" class="value">0.101 s</text>
<text x="40" y="216" class="label">Iragi chunked scan</text>
<rect x="280" y="203" width="500" height="17" rx="4" class="track"/>
<rect x="280" y="203" width="500.0" height="17" rx="4" class="bar2"/>
<text x="792" y="216" class="value">0.368 s</text>
<text x="32" y="270" class="heading">CSV Python-traced peak allocation · MiB · lower is less</text>
<text x="32" y="289" class="note">Excludes native allocations; stream retains row hashes for duplicate counts.</text>
<text x="40" y="328" class="label">Pandas parse only</text>
<rect x="280" y="315" width="500" height="17" rx="4" class="track"/>
<rect x="280" y="315" width="95.8" height="17" rx="4" class="bar0"/>
<text x="792" y="328" class="value">2.005 MiB</text>
<text x="40" y="357" class="label">Iragi classic scan</text>
<rect x="280" y="344" width="500" height="17" rx="4" class="track"/>
<rect x="280" y="344" width="329.4" height="17" rx="4" class="bar1"/>
<text x="792" y="357" class="value">6.895 MiB</text>
<text x="40" y="386" class="label">Iragi chunked scan</text>
<rect x="280" y="373" width="500" height="17" rx="4" class="track"/>
<rect x="280" y="373" width="500.0" height="17" rx="4" class="bar2"/>
<text x="792" y="386" class="value">10.465 MiB</text>
<text x="32" y="440" class="heading">PDF elapsed time · seconds · lower is faster</text>
<text x="32" y="459" class="note">100-page fixture; normalized text SHA-256 is checked for equality.</text>
<text x="40" y="498" class="label">PyMuPDF text only</text>
<rect x="280" y="485" width="500" height="17" rx="4" class="track"/>
<rect x="280" y="485" width="440.5" height="17" rx="4" class="bar0"/>
<text x="792" y="498" class="value">0.048 s</text>
<text x="40" y="527" class="label">Iragi extract (tables off)</text>
<rect x="280" y="514" width="500" height="17" rx="4" class="track"/>
<rect x="280" y="514" width="500.0" height="17" rx="4" class="bar1"/>
<text x="792" y="527" class="value">0.055 s</text>
</svg>
