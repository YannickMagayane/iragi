<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1547" viewBox="0 0 960 1547" role="img" aria-labelledby="title desc">
<title id="title">Iragi benchmark comparison</title>
<desc id="desc">Median runtimes for Iragi profiling, contracts, cleaning, reconciliation, PDF extraction and large-file streaming workloads.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#475569}.heading{font-size:16px;font-weight:700}.note{font-size:11px;fill:#475569}.label{font-size:12px}.value{font-size:12px;font-weight:700}.track{fill:#e2e8f0}.bar0{fill:#64748b}.bar1{fill:#2563eb}.bar2{fill:#0f766e}</style>
<text x="32" y="38" class="title">Iragi 0.6.4 benchmark</text>
<text x="32" y="61" class="subtitle">5 independent timed processes per mode; median shown · one warm-up per mode</text>
<text x="32" y="92" class="heading">CSV elapsed time · seconds · lower is faster</text>
<text x="32" y="111" class="note">Pandas read_csv parses only; Iragi modes also profile and score.</text>
<text x="40" y="150" class="label">Pandas parse only</text>
<rect x="320" y="137" width="455" height="17" rx="4" class="track"/>
<rect x="320" y="137" width="36.4" height="17" rx="4" class="bar0"/>
<text x="787" y="150" class="value">0.032 s</text>
<text x="40" y="179" class="label">Iragi classic scan</text>
<rect x="320" y="166" width="455" height="17" rx="4" class="track"/>
<rect x="320" y="166" width="119.2" height="17" rx="4" class="bar1"/>
<text x="787" y="179" class="value">0.105 s</text>
<text x="40" y="208" class="label">Iragi chunked scan</text>
<rect x="320" y="195" width="455" height="17" rx="4" class="track"/>
<rect x="320" y="195" width="455.0" height="17" rx="4" class="bar2"/>
<text x="787" y="208" class="value">0.403 s</text>
<text x="32" y="250" class="heading">CSV Python-traced peak allocation · MiB · lower is less</text>
<text x="32" y="269" class="note">Excludes native allocations; stream retains row hashes for duplicate counts.</text>
<text x="40" y="308" class="label">Pandas parse only</text>
<rect x="320" y="295" width="455" height="17" rx="4" class="track"/>
<rect x="320" y="295" width="86.8" height="17" rx="4" class="bar0"/>
<text x="787" y="308" class="value">1.996 MiB</text>
<text x="40" y="337" class="label">Iragi classic scan</text>
<rect x="320" y="324" width="455" height="17" rx="4" class="track"/>
<rect x="320" y="324" width="299.8" height="17" rx="4" class="bar1"/>
<text x="787" y="337" class="value">6.894 MiB</text>
<text x="40" y="366" class="label">Iragi chunked scan</text>
<rect x="320" y="353" width="455" height="17" rx="4" class="track"/>
<rect x="320" y="353" width="455.0" height="17" rx="4" class="bar2"/>
<text x="787" y="366" class="value">10.463 MiB</text>
