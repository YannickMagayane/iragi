name: Auto Release on Version Bump

# Triggered on every push to main.
# Creates a GitHub release (and therefore triggers publish.yml) only when
# the version in pyproject.toml has changed compared to the previous commit.

on:
  push:
    branches:
      - main

permissions:
  contents: write   # required to create a GitHub release
  id-token: write   # required by the Trusted Publisher (publish.yml uses it)

jobs:
  detect-and-release:
    name: Detect version bump & create release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need the previous commit to compare

      # -----------------------------------------------------------------------
      # Read the version from pyproject.toml in the current commit
      # -----------------------------------------------------------------------
      - name: Read current version
        id: current
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      # -----------------------------------------------------------------------
      # Read the version from pyproject.toml in the previous commit
      # -----------------------------------------------------------------------
      - name: Read previous version
        id: previous
        run: |
          PREV_VERSION=$(git show HEAD~1:pyproject.toml \
            | grep '^version = ' | head -1 \
            | sed 's/version = "\(.*\)"/\1/' || echo "none")
          echo "version=$PREV_VERSION" >> "$GITHUB_OUTPUT"
          echo "Previous version: $PREV_VERSION"

      # -----------------------------------------------------------------------
      # Create a GitHub release only if the version changed.
      # publish.yml listens on `release: published` and handles PyPI upload.
      # -----------------------------------------------------------------------
      - name: Create GitHub release
        if: steps.current.outputs.version != steps.previous.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.current.outputs.version }}
          OLD_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          echo "Version changed: $OLD_VERSION → $NEW_VERSION"
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --generate-notes \
            --verify-tag=false
          echo "GitHub release v${NEW_VERSION} created — publish.yml will now upload to PyPI."

      - name: No version change detected
        if: steps.current.outputs.version == steps.previous.outputs.version
        run: |
          echo "Version unchanged (${{ steps.current.outputs.version }}). Skipping release."
