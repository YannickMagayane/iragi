name: Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality-check:
    name: Python ${{ matrix.python-version }} / pandas ${{ matrix.pandas-spec }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        pandas-spec: [">=2,<3", ">=3,<4"]
        exclude:
          - python-version: "3.10"
            pandas-spec: ">=3,<4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ".[all,docs,test]" "pandas${{ matrix.pandas-spec }}" pytest-cov pip-audit build twine

      - name: Run automated test suite
        shell: bash
        run: pytest -v --cov=iragi --cov-report=xml --cov-report=term

      - name: Check whether Codecov token is configured
        id: codecov-token
        if: runner.os == 'Linux' && matrix.python-version == '3.12' && matrix.pandas-spec == '>=2,<3'
        shell: bash
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CODECOV_TOKEN is not configured; skipping coverage upload."
          fi

      - name: Upload coverage report
        if: runner.os == 'Linux' && matrix.python-version == '3.12' && matrix.pandas-spec == '>=2,<3' && steps.codecov-token.outputs.available == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Verify clean base installation without Pillow
        if: runner.os == 'Linux' && matrix.python-version == '3.12' && matrix.pandas-spec == '>=2,<3'
        shell: bash
        run: |
          python -m venv /tmp/iragi-clean-venv
          /tmp/iragi-clean-venv/bin/python -m pip install .
          /tmp/iragi-clean-venv/bin/python -c 'import sys; import iragi.scan.engine as engine; import iragi; assert callable(iragi.scan); assert "PIL" not in sys.modules; print(engine.__name__)'

      - name: Audit installed dependencies
        if: runner.os == 'Linux' && matrix.python-version == '3.12' && matrix.pandas-spec == '>=2,<3'
        run: pip-audit

      - name: Verify Sphinx documentation compilation
        if: runner.os == 'Linux' && matrix.python-version == '3.12' && matrix.pandas-spec == '>=2,<3'
        shell: bash
        run: |
          mkdir -p docs/source/api docs/source/_static docs/source/_templates
          mkdir -p docs/source/benchmarks
          cp README.md docs/source/readme.md
          cp README.fr.md docs/source/readme_fr.md
          cp benchmarks/*.svg docs/source/benchmarks/
          sphinx-apidoc -f -e --remove-old -o docs/source/api -H Modules iragi
          sphinx-build -b html docs/source docs/build/html

      - name: Verify package build and metadata
        if: runner.os == 'Linux' && matrix.python-version == '3.12' && matrix.pandas-spec == '>=2,<3'
        shell: bash
        run: |
          python -m build
          python -m twine check dist/*
